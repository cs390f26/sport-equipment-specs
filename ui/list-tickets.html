<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open tickets · Little League Locker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="22" fill="#f7f3ea"/>
          <path d="M10 16c8 6 8 10 0 16M38 16c-8 6-8 10 0 16" fill="none" stroke="#b42318" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>
          <p class="brand-kicker">Riverside Little League</p>
          <p class="brand-title">Equipment Locker</p>
        </span>
      </a>
    </div>
  </header>
  <nav class="app-nav" aria-label="Primary">
    <div class="nav-inner">
      <a href="equipment.html">Equipment</a>
      <a href="tickets.html" aria-current="page">Tickets</a>
    </div>
  </nav>

  <main class="page">
    <header class="page-head">
      <div>
        <p class="eyebrow">View results</p>
        <h1>Open tickets</h1>
        <p class="lede">Choose a ticket to return.</p>
      </div>
      <p class="stat-pill">3 tickets</p>
    </header>

    <section class="ticket-list" aria-label="All tickets">
      <a class="card ticket-row" href="ticket.html">
        <div>
          <h2 class="item-name">Lucas</h2>
          <p class="ticket-meta">
            <span>Bats</span>
            <span>Qty 2</span>
            <span>Ticket k7m2xq9p</span>
          </p>
        </div>
        <span class="btn btn-danger">Return</span>
      </a>
      <a class="card ticket-row" href="ticket.html">
        <div>
          <h2 class="item-name">Maya</h2>
          <p class="ticket-meta">
            <span>Helmets</span>
            <span>Qty 1</span>
            <span>Ticket n4p8wd2c</span>
          </p>
        </div>
        <span class="btn btn-danger">Return</span>
      </a>
      <a class="card ticket-row" href="ticket.html">
        <div>
          <h2 class="item-name">Jordan</h2>
          <p class="ticket-meta">
            <span>Baseballs</span>
            <span>Qty 3</span>
            <span>Ticket t9r3ab6k</span>
          </p>
        </div>
        <span class="btn btn-danger">Return</span>
      </a>
    </section>
  </main>
</body>
</html>
